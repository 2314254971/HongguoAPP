name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Package artifact
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="hongguo-mobile-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > SHA256SUMS.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-mobile-${{ steps.apk.outputs.version }}
          path: |
            hongguo-mobile-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.name }}" SHA256SUMS.txt \
              --title "红果短剧 ${{ steps.apk.outputs.version }}" \
              --generate-notes
          fi
