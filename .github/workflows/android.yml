name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::缺少 KEYSTORE_BASE64，无法构建正式签名包"
              exit 1
            fi
            echo "未配置签名密钥，本次只构建 debug 包"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/hongguo-mobile.jks
          printf 'storeFile=keystore/hongguo-mobile.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "签名密钥已就绪"

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew :app:assembleRelease --no-daemon --console=plain
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew :app:assembleDebug --no-daemon --console=plain
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Package artifact
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="hongguo-mobile-${VERSION}.apk"
          cp "$APK_PATH" "$NAME"
          sha256sum "$NAME" > SHA256SUMS.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $NAME"


      - name: Verify APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "${{ steps.apk.outputs.name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-mobile-${{ steps.apk.outputs.version }}
          path: |
            hongguo-mobile-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.name }}" SHA256SUMS.txt \
              --title "红果短剧 ${{ steps.apk.outputs.version }}" \
              --generate-notes
          fi
